name: Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Get dependencies
        run: go mod download

      # Full quality gate (see the resolved #review-20260910-021):
      # gofmt -s check + go vet + go test -race, matching the README's
      # "Testing & Quality Standard". Kept as a separate step so a failure
      # names the gate instead of vanishing inside `make test`.
      - name: Formatting and vet checks
        run: make check

      - name: Test (race detector)
        run: make test
